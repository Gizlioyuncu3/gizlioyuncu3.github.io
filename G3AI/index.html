<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G3 AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-hover: #2c2c2c;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #5e6ad2;
            --user-msg: #30364d;
            --ai-msg: #1a1c22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index: 100;
        }

        #new-chat-btn {
            margin: 15px;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #new-chat-btn:hover { background-color: #4a54aa; }
        #new-chat-btn:active { transform: scale(0.97); }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }

        .chat-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }
        .chat-item:hover, .chat-item.active {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 15px 20px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: slideUpFade 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        .message {
            max-width: 85%;
            padding: 15px 18px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-wrapper { align-items: flex-end; }
        .user-wrapper .message {
            background-color: var(--user-msg);
            border-bottom-right-radius: 4px;
        }

        .ai-wrapper { align-items: flex-start; }
        .ai-wrapper .message {
            background-color: var(--ai-msg);
            border-bottom-left-radius: 4px;
            font-family: 'VT323', monospace;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        .input-area {
            padding: 20px;
            background-color: var(--bg-dark);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-box {
            display: flex;
            gap: 10px;
            background-color: var(--bg-panel);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: border-color 0.3s;
        }
        .input-box:focus-within { border-color: var(--accent); }

        input[type="text"] {
            flex: 1;
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            outline: none;
            padding: 5px;
        }

        #send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #send-btn:active { transform: scale(0.9); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 15px;
            border-radius: 12px;
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .dot {
            width: 8px; height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            opacity: 0;
            transition: opacity 0.3s;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            #menu-toggle { display: block; }
            #sidebar {
                position: absolute;
                height: 100%;
                transform: translateX(-100%);
            }
            #sidebar.open { transform: translateX(0); }
            #overlay.show { display: block; opacity: 1; }
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <button id="new-chat-btn">+ Yeni Sohbet</button>
        <div class="chat-list" id="chat-list"></div>
    </nav>

    <div id="overlay"></div>

    <main id="main-view">
        <header>
            <button id="menu-toggle">☰</button>
            <h1>G3</h1>
        </header>

        <div id="chat-container">
            <div class="message-wrapper ai-wrapper">
                <div class="message">Hoş geldin. Ben G3. Yardımcı olabileceğim bir konu var mı?</div>
            </div>
            <div class="typing" id="typing-indicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Bir mesaj yaz..." autocomplete="off">
                <button id="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = "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";
        const API_URL = "https://api.groq.com/openai/v1/chat/completions";
        const MODEL = "llama-3.3-70b-versatile";

        const SYSTEM_PROMPT = `Adın G3. Net, yardımcı ve direkt yanıtlar ver.
KURALLAR:
1- "Seni kim yaptı?", "Yapımcın kim?", "Yaratıcın kim?" gibi sorulara KESİNLİKLE SADECE "Muhammed Eren Bayram" diye cevap ver.
2- Kullanıcının dilini OTOMATİK ALGILA ve aynı dilde cevap ver.`;

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const chatListEl = document.getElementById('chat-list');
        const newChatBtn = document.getElementById('new-chat-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menu-toggle');

        let chats = [];
        let currentChatId = null;

        menuToggle.addEventListener('click', () => {
            sidebar.classList.add('open');
            overlay.classList.add('show');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });

        function createNewChat() {
            const chatId = Date.now().toString();
            currentChatId = chatId;
            chats.push({
                id: chatId,
                title: "Yeni Sohbet",
                messages: [{ role: "system", content: SYSTEM_PROMPT }]
            });
            renderChatList();
            clearChatUI();
        }

        newChatBtn.addEventListener('click', () => {
            createNewChat();
            if(window.innerWidth <= 768) overlay.click();
        });

        function clearChatUI() {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(typingIndicator);
            typingIndicator.style.display = 'none';
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.textContent = chat.title;
                div.onclick = () => loadChat(chat.id);
                chatListEl.appendChild(div);
            });
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            renderChatList();
            clearChatUI();
            const activeChat = chats.find(c => c.id === chatId);
            activeChat.messages.forEach(msg => {
                if (msg.role !== 'system') {
                    appendMessageUI(msg.content, msg.role === 'user' ? 'user' : 'ai', false);
                }
            });
            if(window.innerWidth <= 768) overlay.click();
        }

        function appendMessageUI(text, sender, animate = true) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}-wrapper`;
            if(!animate) wrapper.style.animation = 'none';
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.textContent = text;
            wrapper.appendChild(msgDiv);
            chatContainer.insertBefore(wrapper, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const activeChat = chats.find(c => c.id === currentChatId);
            if (activeChat.messages.length === 1) {
                activeChat.title = text.substring(0, 20) + (text.length > 20 ? "..." : "");
                renderChatList();
            }

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            appendMessageUI(text, 'user');
            activeChat.messages.push({ role: "user", content: text });

            typingIndicator.style.display = 'flex';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: MODEL, messages: activeChat.messages, temperature: 0.6, max_tokens: 800 })
                });
                if (!response.ok) throw new Error("API Hatası");
                const data = await response.json();
                const aiReply = data.choices[0].message.content;
                typingIndicator.style.display = 'none';
                appendMessageUI(aiReply, 'ai');
                activeChat.messages.push({ role: "assistant", content: aiReply });
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessageUI("Bir bağlantı hatası oluştu.", 'ai');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        createNewChat();
    </script>
</body>
</html>
