<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kara Delik — Sinematik Uzay Arka Planı</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- ===================== ORTAK VERTEX SHADER ===================== -->
<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<!-- ===================== ANA SAHNE: KARA DELİK ===================== -->
<script id="fs-scene" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;

#define STEPS 128
#define DIN   2.7
#define DOUT  11.0

float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++){
    v += a * vnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}

/* ---------- Derin uzay: yıldız katmanları + nebula ---------- */
vec3 starLayer(vec3 d, float scale, float thresh, float t){
  vec3 p  = d * scale;
  vec3 id = floor(p);
  vec3 f  = fract(p) - 0.5;
  float h = hash13(id);
  if (h < thresh) return vec3(0.0);
  vec3 off = vec3(hash13(id + 1.7), hash13(id + 3.1), hash13(id + 5.9)) - 0.5;
  float dist = length(f - off * 0.75);
  float b  = (h - thresh) / (1.0 - thresh);
  float tw = 0.72 + 0.28 * sin(t * (1.0 + h * 4.0) + h * 40.0);
  float core = smoothstep(0.10, 0.0, dist);
  float glow = exp(-dist * 16.0) * 0.35;
  float temp = hash13(id + 9.3);
  vec3 tint = mix(vec3(0.62, 0.74, 1.0), vec3(1.0, 0.86, 0.66), temp);
  tint = mix(tint, vec3(1.0), 0.35);
  return tint * (core + glow) * b * b * tw * 2.2;
}
vec3 sky(vec3 d, float t){
  vec3 col = vec3(0.0);
  float band = exp(-abs(dot(d, normalize(vec3(0.25, 1.0, 0.18)))) * 2.2);
  vec2 np = vec2(atan(d.z, d.x), asin(clamp(d.y, -1.0, 1.0)));
  float n1 = fbm(np * vec2(2.2, 3.4) + vec2(0.0, t * 0.004));
  float n2 = fbm(np * vec2(4.5, 6.5) + vec2(5.2, t * 0.006));
  float n3 = fbm(np * 3.1 + 9.7);
  col += vec3(0.055, 0.075, 0.16) * n1 * band * 1.3;
  col += vec3(0.16, 0.05, 0.21) * n2 * n2 * band * 1.1;
  col += vec3(0.02, 0.11, 0.13) * n3 * n3 * 0.7;
  col += starLayer(d,  90.0, 0.992, t) * 1.15;
  col += starLayer(d, 210.0, 0.982, t) * 0.80;
  col += starLayer(d, 430.0, 0.962, t) * 0.50;
  return col;
}

/* ---------- Yığılma diski: sıcaklık, Kepler dönüşü, Doppler ---------- */
vec3 diskEmission(vec3 hit, vec3 rayDir, float t, out float absorb){
  float r   = length(hit.xz);
  float phi = atan(hit.z, hit.x);
  float omega = 3.2 * pow(r, -1.5);
  float sp = phi + t * omega;

  vec2 q = vec2(r * 2.6 - t * 0.05, sp * 3.0);
  float n      = fbm(q);
  float n2     = fbm(q * 2.3 + 4.7);
  float streak = vnoise(vec2(r * 9.0, sp * 7.0));
  float density = 0.50 * n + 0.34 * n2 + 0.16 * streak;
  density = pow(max(density, 0.0), 1.35);
  float edge = smoothstep(DIN, DIN + 0.6, r) * (1.0 - smoothstep(DOUT - 3.2, DOUT, r));
  density *= edge;

  float temp = pow(DIN / r, 0.75);
  vec3 tint = mix(vec3(0.60, 0.20, 0.09), vec3(1.0, 0.60, 0.26), smoothstep(0.0, 0.55, temp));
  tint = mix(tint, vec3(1.0, 0.97, 0.90), smoothstep(0.55, 1.0, temp));

  vec3 tangent = normalize(vec3(-hit.z, 0.0, hit.x));
  float beta = clamp(sqrt(0.5 / max(r - 1.0, 0.6)), 0.0, 0.62);
  float gam  = 1.0 / sqrt(1.0 - beta * beta);
  float dop  = 1.0 / (gam * (1.0 + dot(tangent * beta, normalize(rayDir))));
  float grav = sqrt(max(1.0 - 1.0 / r, 0.05));
  float shift = dop * grav;

  tint = mix(tint, vec3(0.85, 0.92, 1.0), clamp((shift - 1.0) * 0.9, 0.0, 0.55));
  tint = mix(tint, vec3(1.0, 0.34, 0.11), clamp((1.0 - shift) * 0.8, 0.0, 0.50));

  float radial = pow(DIN / r, 2.1);
  float inner  = exp(-(r - DIN) * 2.2) * 0.7;
  float I = (density * 1.35 + inner * density) * radial * pow(shift, 3.0) * 3.4;
  absorb = clamp(density * 1.7, 0.0, 0.93);
  return tint * I;
}

void main(){
  vec2 uv = vUv * 2.0 - 1.0;
  uv.x *= uRes.x / uRes.y;
  float t = uTime;

  /* Kamera: yavaş yörünge sürüklenmesi + fare parallaksı */
  float az   = 0.6 + t * 0.016 + uMouse.x * 0.24;
  float dist = 14.0 + sin(t * 0.05) * 0.5;
  float hgt  = 1.35 + uMouse.y * 1.1 + sin(t * 0.037) * 0.25;
  vec3 ro = vec3(sin(az) * dist, hgt, cos(az) * dist);
  vec3 fw = normalize(-ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw * 1.8 + uv.x * rt + uv.y * up);

  /* Schwarzschild ışık bükülmesi (geodezik entegrasyon) */
  vec3 p = ro, v = rd;
  vec3 cr = cross(p, v);
  float h2 = dot(cr, cr);
  vec3 col = vec3(0.0);
  float trans = 1.0, minR = 1000.0;
  bool captured = false;

  for (int i = 0; i < STEPS; i++){
    float r = length(p);
    minR = min(minR, r);
    if (r < 1.0){ captured = true; break; }
    if (r > 26.0 && dot(p, v) > 0.0) break;

    float dt = clamp(r * 0.09, 0.025, 1.0);
    vec3 prev = p;
    float r2 = dot(p, p);
    float invR5 = 1.0 / (r2 * r2 * sqrt(r2));
    v += (-1.5 * h2 * invR5) * p * dt;
    p += v * dt;

    /* Disk düzlemi kesişimi — birden çok görüntü doğal olarak oluşur */
    if (prev.y * p.y < 0.0){
      float f = prev.y / (prev.y - p.y);
      vec3 hit = mix(prev, p, f);
      float hr = length(hit.xz);
      if (hr > DIN && hr < DOUT && trans > 0.02){
        float absorb;
        vec3 em = diskEmission(hit, v, t, absorb);
        col += trans * em;
        trans *= 1.0 - absorb;
      }
    }
  }

  if (!captured){
    col += trans * sky(normalize(v), t);
    col += vec3(1.0, 0.72, 0.45) * 0.16 * exp(-abs(minR - 1.5) * 5.0) * trans;
  }

  /* Pozlama + tonemap + gamma */
  col *= 1.3;
  col = col / (1.0 + col);
  col = pow(col, vec3(0.4545));
  gl_FragColor = vec4(col, 1.0);
}
</script>

<!-- ===================== BLOOM: PARLAK EŞİK ===================== -->
<script id="fs-bright" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
void main(){
  vec3 c = texture2D(uTex, vUv).rgb;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  float f = smoothstep(0.45, 0.85, l);
  gl_FragColor = vec4(c * f, 1.0);
}
</script>

<!-- ===================== BLOOM: GAUSS BLUR ===================== -->
<script id="fs-blur" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
void main(){
  vec3 s = texture2D(uTex, vUv).rgb * 0.227027;
  s += texture2D(uTex, vUv + uDir * 1.3846154).rgb * 0.3162162;
  s += texture2D(uTex, vUv - uDir * 1.3846154).rgb * 0.3162162;
  s += texture2D(uTex, vUv + uDir * 3.2307692).rgb * 0.0702703;
  s += texture2D(uTex, vUv - uDir * 3.2307692).rgb * 0.0702703;
  gl_FragColor = vec4(s, 1.0);
}
</script>

<!-- ===================== KOMPOZİT + FİLM GRADE ===================== -->
<script id="fs-comp" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2 uRes;
uniform float uTime;
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
void main(){
  vec3 base  = texture2D(uScene, vUv).rgb;
  vec3 bloom = texture2D(uBloom, vUv).rgb;
  vec3 c = base + bloom * 0.70;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c += vec3(0.004, 0.006, 0.012) * (1.0 - l);
  c = mix(vec3(l), c, 1.08);
  vec2 q = vUv - 0.5;
  c *= 1.0 - dot(q, q) * 0.55;
  float g = hash12(vUv * uRes + fract(uTime) * vec2(17.0, 23.0));
  c += (g - 0.5) * 0.012;
  gl_FragColor = vec4(c, 1.0);
}
</script>

<script>
(() => {
'use strict';

const canvas  = document.getElementById('scene');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR_CAP = 1.75, MAX_PIXELS = 2.6e6;

let gl = null, lost = false, fallback = false;
let progScene, progBright, progBlur, progComp, vbo;
let loc = {};
let texScene, fboScene, texA, fboA, texB, fboB;
let RW = 2, RH = 2, BW = 1, BH = 1;
let time = 0, last = performance.now();
let mx = 0, my = 0, tmx = 0, tmy = 0;
let scale = 0.9, ema = 16.7, cool = 60, warm = 0;

/* ---------------- WebGL yardımcıları ---------------- */
function shader(type, src){
  const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  if (type === gl.FRAGMENT_SHADER && (!hp || hp.precision === 0))
    src = src.replace('precision highp float;', 'precision mediump float;');
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) || 'shader derlenemedi');
  return s;
}
function program(fsId){
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, document.getElementById(fsId).textContent));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p) || 'program bağlanamadı');
  return p;
}
function uniforms(p, names){
  const o = { prog: p, aPos: gl.getAttribLocation(p, 'aPos') };
  for (const n of names) o[n] = gl.getUniformLocation(p, n);
  return o;
}
function target(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    throw new Error('framebuffer oluşturulamadı');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo };
}
function destroyTarget(t){
  if (!t) return;
  gl.deleteTexture(t.tex);
  gl.deleteFramebuffer(t.fbo);
}
function bindTex(unit, tex, location){
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(location, unit);
}
function draw(locObj){
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(locObj.aPos);
  gl.vertexAttribPointer(locObj.aPos, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------------- Kurulum ---------------- */
function setupGL(){
  progScene  = uniforms(program('fs-scene'),  ['uRes', 'uTime', 'uMouse']);
  progBright = uniforms(program('fs-bright'), ['uTex']);
  progBlur   = uniforms(program('fs-blur'),   ['uTex', 'uDir']);
  progComp   = uniforms(program('fs-comp'),   ['uScene', 'uBloom', 'uRes', 'uTime']);
  vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
}
function resize(){
  if (!gl || lost || fallback) return;
  const w = Math.max(2, innerWidth), h = Math.max(2, innerHeight);
  let dpr = Math.min(devicePixelRatio || 1, DPR_CAP);
  const px = w * h * dpr * dpr;
  if (px > MAX_PIXELS) dpr *= Math.sqrt(MAX_PIXELS / px);
  RW = Math.max(2, Math.floor(w * dpr * scale));
  RH = Math.max(2, Math.floor(h * dpr * scale));
  BW = Math.max(1, Math.floor(RW / 2));
  BH = Math.max(2, Math.floor(RH / 2));
  canvas.width = RW; canvas.height = RH;
  destroyTarget({ tex: texScene, fbo: fboScene });
  destroyTarget({ tex: texA, fbo: fboA });
  destroyTarget({ tex: texB, fbo: fboB });
  let s, a, b;
  try {
    s = target(RW, RH); a = target(BW, BH); b = target(BW, BH);
  } catch(e){ startFallback(); return; }
  texScene = s.tex; fboScene = s.fbo;
  texA = a.tex; fboA = a.fbo;
  texB = b.tex; fboB = b.fbo;
}

/* ---------------- Render ---------------- */
function render(){
  /* 1) Ana sahne */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene);
  gl.viewport(0, 0, RW, RH);
  gl.useProgram(progScene.prog);
  gl.uniform2f(progScene.uRes, RW, RH);
  gl.uniform1f(progScene.uTime, time);
  gl.uniform2f(progScene.uMouse, mx, my);
  draw(progScene);

  /* 2) Parlak eşik */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA);
  gl.viewport(0, 0, BW, BH);
  gl.useProgram(progBright.prog);
  bindTex(0, texScene, progBright.uTex);
  draw(progBright);

  /* 3-6) İki turlu separable blur */
  gl.useProgram(progBlur.prog);
  const blur = (dst, src, dx, dy) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst);
    gl.viewport(0, 0, BW, BH);
    bindTex(0, src, progBlur.uTex);
    gl.uniform2f(progBlur.uDir, dx, dy);
    draw(progBlur);
  };
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboB); blur(fboB, texA, 1.0/BW, 0);
  blur(fboA, texB, 0, 1.0/BH);
  blur(fboB, texA, 2.0/BW, 0);
  blur(fboA, texB, 0, 2.0/BH);

  /* 7) Kompozit */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, RW, RH);
  gl.useProgram(progComp.prog);
  bindTex(0, texScene, progComp.uScene);
  bindTex(1, texA,     progComp.uBloom);
  gl.uniform2f(progComp.uRes, RW, RH);
  gl.uniform1f(progComp.uTime, time);
  draw(progComp);
}

/* ---------------- Ana döngü + adaptif kalite ---------------- */
function frame(now){
  requestAnimationFrame(frame);
  if (lost || fallback) return;
  let dt = (now - last) / 1000; last = now;
  if (dt <= 0) return;
  const ms = Math.min(dt * 1000, 100);
  if (dt > 0.05) dt = 0.05;
  time += dt * (REDUCED ? 0.3 : 1);

  const damp = 1 - Math.pow(0.001, dt);
  mx += (tmx - mx) * damp;
  my += (tmy - my) * damp;

  render();

  ema = ema * 0.95 + ms * 0.05;
  warm++;
  if (cool > 0) cool--;
  else if (warm > 90){
    if (ema > 26 && scale > 0.5){
      scale = Math.max(0.5, scale * 0.85); resize(); cool = 90;
    } else if (ema < 15 && scale < 1){
      scale = Math.min(1, scale * 0.07 + scale); resize(); cool = 90;
    }
  }
}

/* ---------------- WebGL yoksa: zarif 2D yedek ---------------- */
function startFallback(){
  if (fallback) return;
  fallback = true;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;display:block';
  canvas.replaceWith(c);
  const g = c.getContext('2d');
  let w, h, stars = [];
  const rs = () => {
    w = c.width = innerWidth; h = c.height = innerHeight;
    stars = Array.from({length: 420}, () => ({
      x: Math.random()*w, y: Math.random()*h, s: Math.random()*1.4+0.3,
      p: Math.random()*6.28, v: Math.random()*1.5+0.4
    }));
  };
  rs(); addEventListener('resize', rs);
  const loop = (n) => {
    requestAnimationFrame(loop);
    const t = n * 0.001;
    g.fillStyle = '#020208'; g.fillRect(0,0,w,h);
    for (const s of stars){
      g.globalAlpha = 0.3 + 0.7*(0.5+0.5*Math.sin(t*s.v+s.p));
      g.fillStyle = '#cfd8ff';
      g.beginPath(); g.arc(s.x, s.y, s.s, 0, 6.28); g.fill();
    }
    g.globalAlpha = 1;
    const cx = w/2, cy = h/2, r = Math.min(w,h)*0.14;
    g.save(); g.translate(cx,cy); g.scale(1,0.24);
    const gr = g.createRadialGradient(0,0,r*1.1, 0,0,r*3.4);
    gr.addColorStop(0,'rgba(255,246,230,0.9)');
    gr.addColorStop(0.3,'rgba(255,170,90,0.5)');
    gr.addColorStop(1,'rgba(255,120,50,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0,0,r*3.4,0,6.28); g.fill();
    g.restore();
    g.fillStyle = '#000'; g.beginPath(); g.arc(cx,cy,r,0,6.28); g.fill();
    g.strokeStyle = 'rgba(255,230,190,0.8)'; g.lineWidth = 2;
    g.beginPath(); g.arc(cx,cy,r*1.04,0,6.28); g.stroke();
  };
  requestAnimationFrame(loop);
}

/* ---------------- Başlat ---------------- */
try {
  gl = canvas.getContext('webgl', {
    alpha:false, antialias:false, depth:false, stencil:false,
    powerPreference:'high-performance', preserveDrawingBuffer:false
  }) || canvas.getContext('experimental-webgl');
  if (!gl) throw new Error('WebGL yok');
  setupGL();
  resize();
} catch(e){
  console.error(e);
  startFallback();
}

addEventListener('resize', resize, { passive:true });
addEventListener('pointermove', e => {
  tmx = (e.clientX / Math.max(1, innerWidth))  * 2 - 1;
  tmy = (e.clientY / Math.max(1, innerHeight)) * 2 - 1;
}, { passive:true });

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; });
canvas.addEventListener('webglcontextrestored', () => {
  try { lost = false; setupGL(); resize(); } catch(e){ startFallback(); }
});

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
