<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizlioyuncu3 | G3 GAMING</title>
    <style>
        /* Minecraft Fontu */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            color: #fff; 
            font-family: 'VT323', monospace; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* 1. EFSANEVİ SİYAH-BEYAZ VİDEO ARKA PLAN */
        .video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
            /* Videoyu tamamen siyah beyaz ve karanlık yapar */
            filter: grayscale(100%) brightness(0.4) contrast(1.2);
        }

        /* 2. SİYAH-BEYAZ GRANİT KONTEYNER (Diorit Görünümü) */
        .container {
            width: 90%;
            max-width: 450px;
            padding: 35px;
            text-align: center;
            position: relative;
            z-index: 1;
            
            /* Siyah-Beyaz Granit/Diorit Dokusu */
            background-color: rgba(30, 30, 30, 0.8);
            background-image: url('data:image/svg+xml;utf8,<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><rect width="16" height="16" fill="none"/><rect x="2" y="2" width="2" height="2" fill="%23444"/><rect x="8" y="4" width="4" height="2" fill="%23666"/><rect x="12" y="10" width="2" height="2" fill="%23333"/><rect x="4" y="12" width="2" height="4" fill="%23555"/><rect x="10" y="2" width="2" height="2" fill="%23222"/><rect x="6" y="8" width="2" height="2" fill="%23111"/></svg>');
            background-size: 48px 48px;
            
            border: 4px solid #ffffff; 
            box-shadow: 0 0 30px rgba(255,255,255,0.2), inset 0 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px); /* Cam efekti */
        }

        /* Beyaz Neon Başlık */
        h1 { 
            font-size: 3.5rem; 
            color: #ffffff; 
            text-shadow: 0 0 15px #fff, 0 0 30px #ffffff88;
            margin-bottom: 30px; 
            letter-spacing: 4px;
            border-bottom: 2px solid #fff;
            display: inline-block;
            padding-bottom: 5px;
        }

        .game-menu { display: flex; flex-direction: column; gap: 20px; }

        /* 3. SİYAH-BEYAZ NEON BUTONLAR */
        .game-card {
            display: block;
            padding: 16px;
            text-decoration: none;
            color: white;
            font-size: 1.7rem;
            font-weight: bold;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            box-shadow: 0 0 5px #fff, inset 0 0 5px #fff;
            text-shadow: 0 0 5px #fff;
            position: relative;
            overflow: hidden;
        }

        /* Hover: Parlama Efekti */
        .game-card:hover { 
            transform: scale(1.05);
            background: #fff;
            color: #000;
            box-shadow: 0 0 40px #fff, 0 0 80px #ffffff88;
            text-shadow: none;
        }

        /* Credits (Yapan Kişi) */
        .credits {
            margin-top: 30px;
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            letter-spacing: 2px;
        }

        .footer { 
            margin-top: 15px; 
            color: #888; 
            font-size: 0.9rem;
        }

        /* Sayfa Kenarlarındaki Hafif Karanlık (Vignette) */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, black 150%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://cdn.pixabay.com/video/2023/10/22/186105-877022067_large.mp4" type="video/mp4">
    </video>

    <div class="vignette"></div>

    <div class="container">
        <h1>G3 GAMING</h1>
        
        <div class="game-menu">
            <a href="./ValoStrike/" target="_blank" class="game-card">
                VALOSTRIKE
            </a>

            <a href="./G3Craft/" target="_blank" class="game-card">
                G3CRAFT
            </a>

            <a href="./MobileG3Craft/" target="_blank" class="game-card">
                MOBILEG3CRAFT
            </a>

            <a href="./MobileValoStrike/" target="_blank" class="game-card">
                MOBILEVALOSTRIKE
            </a>
        </div>

        <div class="credits">Yapan: Gizlioyuncu3</div>
        <p class="footer">gizlioyuncu3.github.io</p>
    </div>

</body>
</html>
