<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizlioyuncu3 | G3 GAMING</title>
    <style>
        /* Minecraft Fontu */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            color: #fff; 
            font-family: 'VT323', monospace; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-color: #000; /* Arka plan tamamen siyah */
        }

        /* 1. ARKA PLAN UÇUŞAN PARÇACIK KATMANI */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        /* 2. SİYAH-BEYAZ GRANİT (DİORİT) KONTEYNER (DOKUNULMADI) */
        .container {
            width: 95%;
            max-width: 450px;
            padding: 35px;
            text-align: center;
            position: relative;
            z-index: 1;
            
            background-color: rgba(20, 20, 20, 0.85);
            /* Siyah-Beyaz Minecraft Dokusu */
            background-image: url('data:image/svg+xml;utf8,<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><rect width="16" height="16" fill="none"/><rect x="2" y="2" width="2" height="2" fill="%23444"/><rect x="8" y="4" width="4" height="2" fill="%23666"/><rect x="12" y="10" width="2" height="2" fill="%23333"/><rect x="4" y="12" width="2" height="4" fill="%23555"/></svg>');
            background-size: 48px 48px;
            
            border: 4px solid #ffffff; 
            box-shadow: 0 0 30px rgba(255,255,255,0.2), inset 0 0 15px rgba(0,0,0,1);
            backdrop-filter: blur(5px);
        }

        h1 { 
            font-size: 3.5rem; 
            color: #ffffff; 
            text-shadow: 0 0 15px #fff;
            margin-bottom: 30px; 
            letter-spacing: 4px;
            border-bottom: 2px solid #fff;
            display: inline-block;
        }

        .game-menu { display: flex; flex-direction: column; gap: 20px; }

        /* 3. BEYAZ NEON BUTONLAR (DOKUNULMADI) */
        .game-card {
            display: block;
            padding: 16px;
            text-decoration: none;
            color: white;
            font-size: 1.8rem;
            transition: all 0.4s ease;
            
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #fff;
            box-shadow: 0 0 5px #fff, inset 0 0 5px #fff;
            text-shadow: 0 0 5px #fff;
        }

        .game-card:hover { 
            transform: scale(1.05);
            background: #fff;
            color: #000;
            box-shadow: 0 0 40px #fff;
            text-shadow: none;
        }

        .credits {
            margin-top: 30px;
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }

        .footer { margin-top: 15px; color: #666; font-size: 0.9rem; }

        /* Ekran kenarlarındaki karartma */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, black 150%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="overlay"></div>

    <div class="container">
        <h1>GIZLIOYUNCU3</h1>
        
        <div class="game-menu">
            <a href="./ValoStrike/" target="_blank" class="game-card">
                VALOSTRIKE
            </a>

            <a href="./G3Craft/" target="_blank" class="game-card">
                G3CRAFT
            </a>

            <a href="./MobileG3Craft/" target="_blank" class="game-card">
                MOBILEG3CRAFT
            </a>

            <a href="./MobileValoStrike/" target="_blank" class="game-card">
                MOBILEVALOSTRIKE
            </a>
        </div>

        <div class="credits">Yapan: Gizlioyuncu3</div>
        <p class="footer">gizlioyuncu3.github.io</p>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        // Ekran boyutu değiştikçe arka planı tam ekran yap
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 70; // Ekranda aynı anda uçuşacak cisim sayısı

        class Particle {
            constructor() {
                this.reset();
                // Sayfa ilk açıldığında cisimler ekranın her yerine dağılsın
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10; // Ekranın altından girsinler (Yukarı uçuş efekti)
                this.size = Math.random() * 4 + 2; // Minecraft konsepti için 2px ile 6px arası kareler
                this.speedY = -(Math.random() * 0.8 + 0.3); // Yukarı doğru uçma hızı
                this.speedX = (Math.random() - 0.5) * 0.4; // Hafif rüzgar / sağa sola salınım efekti
                this.opacity = Math.random() * 0.6 + 0.2; // Rastgele saydamlık (Derinlik hissi verir)
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                // Cisim ekrandan tamamen çıkarsa tabandan tekrar üret
                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                // Tam Minecraft temasına uyması için kare pikseller halinde çiziyoruz (fillRect)
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        // Cisimleri oluştur
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Sürekli yenilenen animasyon döngüsü
        function animate() {
            ctx.fillStyle = '#000000'; // Tam siyah arka plan
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
